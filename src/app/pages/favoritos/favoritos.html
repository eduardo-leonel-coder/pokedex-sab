<h1>⭐ Mis Favoritos ({{favoritos.total()}})</h1>

@if (!favoritos.hayFavoritos()){
    <p>Aun no tienes favoritos. Ve al Pokedex y marca alguno.</p>
} @else {
    <div class="grid">
        @for (p of favoritos.lista(); track p.id) {
            <app-pokemon-card
                [name]="p.name"
                [id]="p.id"
                [spriteUrl]="p.spriteUrl"
                [types]="p.types ?? []"
                [esFavorito]="true"
                (esFavoritoChange)="favoritos.alternar(p)"
            />
           
        }
    </div>
}
